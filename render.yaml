services:
  - type: web
    name: paperflow-api
    runtime: docker
    rootDir: BE
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECURE_COOKIES
        value: true
      - key: COOKIE_SAMESITE
        value: none
      # The Vercel hostname remains a safe rollback path while the public
      # domain becomes the primary origin.  These values contain no secrets.
      - key: ALLOWED_ORIGINS
        value: https://paper-flow-v2.vercel.app,https://www.paperflow.space,https://paperflow.space
      # PayOS redirects the browser here after checkout.  Payment activation
      # still occurs only through the Render webhook after signature checks.
      - key: PAYOS_RETURN_URL
        value: https://www.paperflow.space/billing/result
      - key: PAYOS_CANCEL_URL
        value: https://www.paperflow.space/billing/result
      - key: SUPABASE_BUCKET
        value: paperflow
      # Set GOOGLE_OAUTH_CLIENT_ID in the Render dashboard. The client secret
      # is not used by PaperFlow's ID-token sign-in flow.
      # Set the remaining values as secrets in the Render dashboard. They are
      # intentionally not included in source control.
